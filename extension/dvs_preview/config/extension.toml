[package]
version = "0.1.0"
title = "DVS Preview"
description = "Live red/blue DVS event preview for dvs_gen cameras in the Isaac Lab GUI"
category = "Simulation"
keywords = ["dvs", "event camera", "isaac lab", "isaac sim"]
authors = ["SPIKE Lab, JHU"]

# omni.kit.app is a kit-kernel module the resolver can't version-resolve, so it is
# not listed. The rest must be declared: in headless runs they are not preloaded.
[dependencies]
"omni.ui" = {}
"omni.usd" = {}
"omni.replicator.core" = {}

[[python.module]]
name = "dvs_preview"
